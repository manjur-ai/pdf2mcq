[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2mcq"
version = "1.0.0"
description = "Convert PDF files (text, scanned, mixed) into MCQ questions using AI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["mcq", "quiz", "ai", "education", "pdf", "ocr", "llm", "openrouter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Text Processing",
]

dependencies = [
    "anthropic>=0.25",
    "openai>=1.30",
    "pymupdf>=1.24",
    "Pillow>=10.0",
    "pytesseract>=0.3",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "build", "twine"]

[project.scripts]
pdf2mcq = "pdf2mcq.cli:main"

[project.urls]
Homepage = "https://github.com/manjur-ai/pdf2mcq"
Issues   = "https://github.com/manjur-ai/pdf2mcq/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pdf2mcq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["scripts"]
